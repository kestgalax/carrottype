name: CarrotType
options:
  bundleIdPrefix: app.carrottype
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  knownRegions:
    - en
    - ru
    - Base
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  WhisperMetalKit:
    url: https://github.com/carloshpdoc/WhisperMetalKit.git
    from: 0.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
targets:
  CarrotTypeCleanupHelper:
    type: tool
    platform: macOS
    sources:
      - path: CarrotTypeCleanupHelper
      - path: Shared
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carrottype.macos.cleanup-helper
        PRODUCT_NAME: CarrotTypeCleanupHelper
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_SWIFT_FLAGS: "$(inherited)"
  CarrotType:
    type: application
    platform: macOS
    sources:
      - path: CarrotType
        excludes:
          - Resources
      - path: CarrotType/Resources
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: CarrotTypeCleanupHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: WhisperMetalKit
        product: WhisperMetalKit
      - package: FluidAudio
        product: FluidAudio
      - package: swift-huggingface
        product: HuggingFace
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carrottype.macos
        PRODUCT_NAME: CarrotType
        INFOPLIST_FILE: CarrotType/Info.plist
        CODE_SIGN_ENTITLEMENTS: CarrotType/CarrotType.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        OTHER_SWIFT_FLAGS: "$(inherited)"
    entitlements:
      path: CarrotType/CarrotType.entitlements
    # After compile / embed helper, before final CodeSign — so metallib is inside the signed app.
    postCompileScripts:
      - name: Embed MLX metallib for cleanup helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # MLX loads shaders from mlx-swift_Cmlx.bundle via the app main bundle.
          # SPM puts the bundle in BUILT_PRODUCTS_DIR; the tool target does not embed it.
          # Do not place *.metallib under Contents/MacOS — codesign treats it as unsigned code.
          BUNDLE="${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle"
          APP_RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [[ ! -d "$BUNDLE" ]]; then
            echo "error: mlx-swift_Cmlx.bundle missing at $BUNDLE (MetalToolchain / Cmlx build?)" >&2
            exit 1
          fi
          mkdir -p "$APP_RES"
          rm -rf "${APP_RES}/mlx-swift_Cmlx.bundle"
          cp -R "$BUNDLE" "$APP_RES/"
          echo "Embedded mlx-swift_Cmlx.bundle into app Resources"
    info:
      path: CarrotType/Info.plist
      properties:
        CFBundleName: CarrotType
        CFBundleDisplayName: CarrotType
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.8"
        CFBundleVersion: "9"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: CarrotType записывает звук с микрофона только пока вы удерживаете или нажимаете горячую клавишу. Аудио обрабатывается локально и никуда не отправляется.
        NSSpeechRecognitionUsageDescription: CarrotType может использовать системное распознавание речи Apple (SpeechAnalyzer) только на этом Mac, чтобы превратить вашу диктовку в текст. Аудио никуда не отправляется.
        NSPrincipalClass: NSApplication
