name: CarrotType
options:
  bundleIdPrefix: app.carrottype
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  knownRegions:
    - en
    - ru
    - Base
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  WhisperMetalKit:
    url: https://github.com/carloshpdoc/WhisperMetalKit.git
    from: 0.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
targets:
  CarrotType:
    type: application
    platform: macOS
    sources:
      - path: CarrotType
        excludes:
          - Resources
      - path: CarrotType/Resources
        buildPhase: resources
    dependencies:
      - package: WhisperMetalKit
        product: WhisperMetalKit
      - package: FluidAudio
        product: FluidAudio
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carrottype.macos
        PRODUCT_NAME: CarrotType
        INFOPLIST_FILE: CarrotType/Info.plist
        CODE_SIGN_ENTITLEMENTS: CarrotType/CarrotType.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        OTHER_SWIFT_FLAGS: "$(inherited)"
    entitlements:
      path: CarrotType/CarrotType.entitlements
    info:
      path: CarrotType/Info.plist
      properties:
        CFBundleName: CarrotType
        CFBundleDisplayName: CarrotType
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: CarrotType записывает звук с микрофона только пока вы удерживаете или нажимаете горячую клавишу. Аудио обрабатывается локально и никуда не отправляется.
        NSPrincipalClass: NSApplication
